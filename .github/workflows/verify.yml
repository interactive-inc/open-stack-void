name: Verify
on:
  push:
    branches: [main, release]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      VP_PACKAGE_MANAGER: npm@12.2.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Reserve loopback port on the dedicated hosted runner
        shell: pwsh
        run: |
          $listeners = @(Get-NetTCPConnection -State Listen -LocalPort 80 -ErrorAction SilentlyContinue)
          $owners = @($listeners | Select-Object -ExpandProperty OwningProcess -Unique | ForEach-Object {
            $owner = Get-CimInstance Win32_Process -Filter "ProcessId=$_"
            @{ pid = $_; name = $owner.Name }
          })
          $services = @(Get-Service W3SVC,WAS -ErrorAction SilentlyContinue | Select-Object Name,Status)
          @{ kind = 'initial-proxy-ownership'; listeners = $owners; services = $services } | ConvertTo-Json -Compress -Depth 4
          if ($listeners.Count) {
            $response = Invoke-WebRequest 'http://127.0.0.1/' -Method Head -SkipHttpErrorCheck -TimeoutSec 5
            @{ kind = 'initial-proxy-identity'; status = [int]$response.StatusCode; portless = $response.Headers['X-Portless']; server = $response.Headers['Server'] } | ConvertTo-Json -Compress
            if (($response.Headers['X-Portless'] -join '') -ne '1') {
              $iis = Get-Service W3SVC -ErrorAction SilentlyContinue
              if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or
                  ($response.Headers['Server'] -join '') -ne 'Microsoft-IIS/10.0' -or
                  @($owners | Where-Object { $_.pid -ne 4 }).Count -gt 0 -or
                  -not $iis -or $iis.Status -ne 'Running') {
                throw 'Unknown port 80 owner; no services were changed.'
              }
              Stop-Service -Name W3SVC -ErrorAction Stop
              $iis.WaitForStatus('Stopped', [TimeSpan]::FromSeconds(10))
              if (@(Get-NetTCPConnection -State Listen -LocalPort 80 -ErrorAction SilentlyContinue).Count) {
                throw 'Port 80 is still occupied; no additional services will be stopped.'
              }
              Write-Output 'Stopped only the preinstalled IIS Web service on this disposable GitHub-hosted runner.'
            }
          }
      - name: Bootstrap the pinned operation frontend
        shell: pwsh
        run: npm install --global npm@12.2.1 vite-plus@1.4.0 --ignore-scripts
      - name: Install without dependency hooks
        run: vp install --frozen-lockfile
      - name: Verify publication age and prepare approved builds
        run: vp run prepare:local
      - name: Install checksum-pinned secret scanner
        run: vp run setup:scanner
      - name: Secret scan without printing findings
        run: vp run check:secrets
      - name: Require rationale updates for owned changes
        shell: pwsh
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ($env:REVIEW_BASE -and $env:REVIEW_BASE -notmatch '^0+$') { $env:DOCS_BASE = $env:REVIEW_BASE }
          vp run check:docs
      - name: Prepare browser runtime
        run: vp exec playwright install chromium
      - name: Full isolated verification
        run: vp run verify:full
      - name: Confirm exact clean verification
        run: vp run check:verification
